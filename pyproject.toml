[project]
name = "ha-temporary-guest"
version = "0.3.1"
description = "Owner-only temporary guest account manager for Home Assistant"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC", "RUF"]
ignore = ["E501"]
